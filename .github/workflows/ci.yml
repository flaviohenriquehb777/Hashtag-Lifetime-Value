name: CI Pipeline - Hashtag LTV

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull data from DVC
        run: |
          dvc pull
          ls -l data/raw/ltv_base.csv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}

      - name: Reprodutibilidade do Pipeline (DVC & MLflow)
        continue-on-error: true
        run: |
          dvc repro
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: https://dagshub.com/flaviohenriquehb777/Hashtag-Lifetime-Value.mlflow
          MLFLOW_TRACKING_USERNAME: flaviohenriquehb777
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DVC_ACCESS_KEY_ID }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DVC_ACCESS_KEY_ID }}

      - name: Run Unit Tests with Pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/ -v --cov=src --cov-report=term-missing
